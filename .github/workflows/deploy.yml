name: Deploy FTP (Hostinger)

on:
  push:
    branches: [main]
  # Permite redisparar o deploy pela aba Actions sem precisar de commit novo.
  workflow_dispatch:

# Duas execucoes simultaneas escreveriam no mesmo diretorio FTP ao mesmo
# tempo e corromperiam o arquivo de estado da sincronizacao. Uma por vez.
concurrency:
  group: deploy-ftp
  cancel-in-progress: false

# Valores compartilhados pelas duas tentativas de envio. Ficam aqui para que
# nao exista risco de alterar um passo e esquecer o outro.
env:
  FTP_LOCAL_DIR: ./
  FTP_SERVER_DIR: /domains/espacomulherpreciosa.com.br/public_html/
  FTP_TIMEOUT: 120000
  FTP_EXCLUDE: |
    **/.git*
    **/.git*/**
    **/node_modules/**
    **/.github/**
    **/.claude/**
    **/designsystem/**
    **/*.md
    **/vercel.json
    **/.DS_Store
    **/Thumbs.db
    **/.env*

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # Sem npm ci e sem build: o site e estatico e as libs (three, gsap,
      # lenis, chart.js) chegam por CDN via import map nos HTMLs. O que esta
      # no repositorio e exatamente o que vai para o ar.
      #
      # O FTP da Hostinger emudece o socket de controle de tempo em tempo e a
      # action morre por timeout. Ja aconteceu com 60s e com 120s de limite, e
      # nas duas vezes a execucao seguinte passou sem nenhuma mudanca - logo o
      # problema e intermitencia do servidor, nao configuracao. Aumentar o
      # timeout so faz a falha demorar mais; o que resolve e tentar de novo.
      #
      # A repeticao e segura porque a action e idempotente: ela compara o
      # arquivo de estado no servidor com os arquivos locais e reenvia apenas
      # a diferenca. Se a primeira tentativa subiu metade, a segunda continua
      # de onde parou.
      - name: Envia o site por FTP
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Hostinger compartilhada expoe FTP puro na porta 21.
          protocol: ftp
          local-dir: ${{ env.FTP_LOCAL_DIR }}
          server-dir: ${{ env.FTP_SERVER_DIR }}
          timeout: ${{ env.FTP_TIMEOUT }}
          exclude: ${{ env.FTP_EXCLUDE }}

      - name: Segunda tentativa (o FTP da Hostinger cai de vez em quando)
        if: steps.ftp1.outcome == 'failure'
        id: ftp2
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ${{ env.FTP_LOCAL_DIR }}
          server-dir: ${{ env.FTP_SERVER_DIR }}
          timeout: ${{ env.FTP_TIMEOUT }}
          exclude: ${{ env.FTP_EXCLUDE }}

      - name: Terceira tentativa
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ${{ env.FTP_LOCAL_DIR }}
          server-dir: ${{ env.FTP_SERVER_DIR }}
          timeout: ${{ env.FTP_TIMEOUT }}
          exclude: ${{ env.FTP_EXCLUDE }}
