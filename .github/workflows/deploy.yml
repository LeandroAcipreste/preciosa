name: Deploy FTP (Hostinger)

on:
  push:
    branches: [main]
  # Permite redisparar o deploy pela aba Actions sem precisar de commit novo.
  workflow_dispatch:

# Duas execucoes simultaneas escreveriam no mesmo diretorio FTP ao mesmo
# tempo e corromperiam o arquivo de estado da sincronizacao. Uma por vez.
concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # Sem npm ci e sem build: o site e estatico e as libs (three, gsap,
      # lenis, chart.js) chegam por CDN via import map nos HTMLs. O que esta
      # no repositorio e exatamente o que vai para o ar.
      - name: Envia o site por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # Hostinger compartilhada expoe FTP puro na porta 21. Este ja e o
          # default da action, declarado aqui apenas para deixar explicito.
          protocol: ftp

          local-dir: ./
          server-dir: /public_html/

          # Assets grandes (video da hero, HDRI, .glb) precisam de mais
          # folga que os 30s padrao em conexao compartilhada.
          timeout: 60000

          # Como agora sobe a raiz do repositorio, o exclude e o que separa
          # o site do que nao deve ser publicado. Ao declarar exclude, os
          # padroes default da action sao substituidos - por isso .git* e
          # node_modules estao repetidos aqui.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/.claude/**
            **/designsystem/**
            **/*.md
            **/vercel.json
            **/.DS_Store
            **/Thumbs.db
            **/.env*
